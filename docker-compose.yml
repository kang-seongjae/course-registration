# MySQL 데이터베이스를 Docker 컨테이너로 실행하기 위한 설정 파일
# 실행: docker compose up -d   /  종료: docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: course-registration-mysql
    ports:
      - "3306:3306"                     # 내 PC의 3306 포트 -> 컨테이너의 3306 포트
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: course_registration   # 시작 시 자동으로 만들어지는 데이터베이스
      MYSQL_USER: app                       # 애플리케이션이 접속할 계정
      MYSQL_PASSWORD: app1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4      # 한글 저장을 위한 문자 집합
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql           # 컨테이너를 지워도 데이터가 남도록 볼륨에 저장
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 4단계-3: Spring Boot 앱을 Linux 컨테이너로 실행한다.
  # profiles 때문에 평소 `docker compose up -d` 는 MySQL 만 띄우고,
  # `docker compose --profile app up -d --build` 로 실행할 때만 함께 뜬다.
  # (로컬에서 gradlew bootRun 으로 띄울 때 8080 포트가 겹치지 않도록)
  app:
    build: .
    image: course-registration-app
    container_name: course-registration-app
    profiles: ["app"]
    ports:
      - "8080:8080"                     # 내 PC의 8080 -> 컨테이너의 8080 (Docker Desktop 이 중계)
    environment:
      # 같은 compose 네트워크 안에서는 서비스 이름(mysql)이 곧 호스트 이름이다
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/course_registration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_PROFILES_ACTIVE: load      # 부하 측정용 (SQL 로그 끔)
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy      # MySQL 이 ping 에 응답한 뒤에 앱을 시작

volumes:
  mysql-data:
