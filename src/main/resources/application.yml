# Spring Boot 애플리케이션 설정 파일
spring:
  application:
    name: course-registration

  datasource:
    # docker-compose.yml 에서 정의한 MySQL 접속 정보
    url: jdbc:mysql://localhost:3306/course_registration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: app
    password: app1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # DB 커넥션 풀 크기 (기본 10). 4단계-1에서 10/30/50 을 비교해 50 으로 결정.
      # MySQL max_connections(기본 151) 보다 작아야 하며, 서버를 여러 대 띄우면 합계를 고려해야 한다.
      maximum-pool-size: 50

  jpa:
    hibernate:
      # update: 엔티티 클래스를 보고 테이블이 없으면 만들고, 있으면 그대로 사용
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 보기 좋게 출력 (학습용)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080
  tomcat:
    # TCP 접속 수락 대기열 길이 (기본 100). 4단계-1에서 조정했지만 Windows 는 OS 가 200 으로 제한해 효과가 없었다.
    # Linux 에서는 somaxconn 범위 안에서 그대로 적용된다.
    accept-count: 1000
